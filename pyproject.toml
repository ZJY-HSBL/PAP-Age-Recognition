[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pap-age-recognition"
version = "1.0.0"
description = "Personalized Aging Pattern facial age estimation with CNN, PCA, LSTM and attention"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research Codebase Maintainer"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
face = ["facenet-pytorch>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pap-age = "pap_age.cli:main"

[tool.setuptools.packages.find]
include = ["pap_age*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
